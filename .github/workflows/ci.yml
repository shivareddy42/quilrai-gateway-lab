name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  assessment:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned package manager
        run: python -m pip install uv==0.13.7
      - name: Install locked dependencies
        run: uv sync --locked --python '${{ matrix.python }}'
      - name: Lint and format
        run: make check
      - name: Test, including subprocesses and real network demo
        run: make test
      - name: Repeat quota contention checks
        run: |
          for attempt in 1 2 3 4 5; do
            uv run --locked pytest -q --cov=quilr_gateway --cov-append --cov-report= \
              tests/test_limiter.py::test_same_tenant_concurrency_multiple_connections \
              tests/test_limiter.py::test_real_processes_share_atomic_quota
          done
      - name: Standalone reviewer demo
        run: uv run --locked quilr-demo
